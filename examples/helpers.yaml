# Optional helpers for the advanced setup. Paste into configuration.yaml
# (or create the same helpers in Settings → Devices & services → Helpers).
# Replace switch.boiler / sensor.boiler_power with your own entity IDs.

timer:
  boiler_timer:
    name: Boiler Timer
    icon: mdi:water-boiler

script:
  boiler_run_timer:
    alias: Boiler - Run Timer
    mode: restart
    fields:
      minutes:
        name: Minutes
        required: true
        default: 15
        selector:
          number: { min: 5, max: 1440, step: 5, unit_of_measurement: min }
    sequence:
      - action: switch.turn_on
        target: { entity_id: switch.boiler }
      - action: timer.start
        target: { entity_id: timer.boiler_timer }
        data:
          duration: "{{ '%02d:%02d:00' | format((minutes | int(15)) // 60, (minutes | int(15)) % 60) }}"

  boiler_off:
    alias: Boiler - Turn Off
    sequence:
      - action: switch.turn_off
        target: { entity_id: switch.boiler }
      - action: timer.cancel
        target: { entity_id: timer.boiler_timer }

  # Started by a schedule: runs until the end time of the schedule slot that just fired.
  boiler_scheduled_run:
    alias: Boiler - Scheduled Run
    mode: restart
    fields:
      job_source:
        selector: { text: }
    sequence:
      - variables:
          slot: >
            {% set now_hm = now().strftime('%H:%M') %}
            {% set ns = namespace(start='', stop='') %}
            {% for s in states.switch | selectattr('entity_id', 'match', '^switch[.]schedule_') %}
              {% set tags = s.attributes.get('tags', []) %}
              {% set tags = [tags] if tags is string else tags %}
              {% if 'boiler' in tags and s.state in ['on', 'triggered'] %}
                {% for t in s.attributes.get('timeslots', []) %}
                  {% set p = (t | string).split(' - ') %}
                  {% if p | count == 2 and p[0][:5] == now_hm %}
                    {% set ns.start = p[0] %}{% set ns.stop = p[1] %}
                  {% endif %}
                {% endfor %}
              {% endif %}
            {% endfor %}
            {{ dict(start=ns.start, stop=ns.stop) }}
      - condition: template
        value_template: "{{ slot.stop != '' }}"
      - variables:
          seconds: >
            {% set a = today_at(slot.start) %}{% set b = today_at(slot.stop) %}
            {% set b = b + timedelta(days=1) if b <= a else b %}
            {{ (as_timestamp(b) - as_timestamp(now())) | int }}
      - action: switch.turn_on
        target: { entity_id: switch.boiler }
      - action: timer.start
        target: { entity_id: timer.boiler_timer }
        data:
          duration: "{{ '%02d:%02d:%02d' | format(seconds // 3600, (seconds % 3600) // 60, seconds % 60) }}"

automation:
  - alias: Boiler - Timer end
    triggers:
      - trigger: event
        event_type: timer.finished
        event_data: { entity_id: timer.boiler_timer }
        id: timer_done
      - trigger: state
        entity_id: switch.boiler
        to: "off"
        id: boiler_off
    actions:
      - if:
          - condition: trigger
            id: timer_done
        then:
          - action: switch.turn_off
            target: { entity_id: switch.boiler }
        else:
          - action: timer.cancel
            target: { entity_id: timer.boiler_timer }

# Energy and cost for the History → Electric costs page.
sensor:
  - platform: integration
    source: sensor.boiler_power
    name: Boiler Energy
    unit_prefix: k
    round: 3
    method: left

utility_meter:
  boiler_energy_monthly:
    source: sensor.boiler_energy
    name: Boiler Energy Monthly
    cycle: monthly

template:
  - sensor:
      - name: Boiler Cost Monthly
        unit_of_measurement: "₪"
        state_class: measurement
        state: "{{ (states('sensor.boiler_energy_monthly') | float(0) * 0.6402) | round(2) }}"
