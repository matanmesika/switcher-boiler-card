name: Publish v1.0.0
on:
  push:
    branches: [main]
    paths:
      - '.release/v1.0.0'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify release content
        run: |
          node --check dist/switcher-boiler-card.js
          node --test tests/test_card.cjs
          python3 -m json.tool hacs.json >/dev/null
          grep -q "CARD_VERSION = '1.0.0'" dist/switcher-boiler-card.js
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.0.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Release already exists; refusing overwrite'
            exit 1
          fi
          gh release create v1.0.0 --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Switcher Boiler Card v1.0.0" --notes-file docs/releases/v1.0.0.md --latest dist/switcher-boiler-card.js
